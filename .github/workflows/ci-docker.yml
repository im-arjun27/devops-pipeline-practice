name: Build Docker Image

on:
  workflow_call:
    inputs:
      full_tag:
        required: true
        type: string
      test_passed:
        required: true
        type: string

jobs:
  docker_build:
    if: ${{ inputs.test_passed == "true" }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repo
        uses: actions/checkoout@v4
        
      - name: Setup Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: docker.io/devops-practice/spring-boot-api:${{ inputs.full_tag }}