name: Build Docker Image

on:
  workflow_call:
    inputs:
      full_tag:
        required: true
        type: string
      test_passed:
        required: true
        type: string

jobs:
  docker_build:
    if: ${{ inputs.test_passed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Debug full_tag value
        run: |
          echo "FULL TAG RECEIVED: '${{ inputs.full_tag }}'"

      - name: Debug full_tag value
        run: |
          echo "TEST RESULT RECEIVED: '${{ inputs.test_passed }}'"

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Debug Docker Context
        run: |
          echo "DockerHub Username: '${{ secrets.DOCKERHUB_USERNAME }}'"
          echo "Image Target: docker.io/arjun2701/spring-boot-api:${{ inputs.full_tag }}"

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Debug full_tag value
        run: |
          echo "FULL TAG RECEIVED: '${{ inputs.full_tag }}'"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: docker.io/arjun2701/spring-boot-api:${{ inputs.full_tag }}
