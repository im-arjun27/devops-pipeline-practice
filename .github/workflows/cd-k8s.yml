name: CD pipeline to Deploy in K8s
on:
  workflow_run:
    workflows: ["Main Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, devops-pipeline-practice]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to K8s
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Verify pods
        run: kubectl get pods -o wide

      - name: Verify service
        run: kubectl get svc
