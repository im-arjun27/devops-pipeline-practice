name: CD pipeline to Deploy in K8s
on:
  workflow_run:
    workflows: ["MAIN PIPELINE"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to K8s
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      - name: Verify pods
        run: kubectl get pods -o wide

      - name: Verify service
        run: kubectl get svc
